# Independent auth deployment: docker compose --env-file auth.env -f auth.compose.yml ...
name: flowdraw-auth
services:
  auth-service:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/flowdraw-auth:${AUTH_IMAGE_TAG:?set AUTH_IMAGE_TAG}
    restart: unless-stopped
    environment:
      AUTH_ADDRESS: :8080
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:?set AUTH_DATABASE_URL}
      AUTH_ISSUER: https://auth.k1n3ticnerdcore.tech
      AUTH_PUBLIC_URL: https://auth.k1n3ticnerdcore.tech
      AUTH_COOKIE_SECURE: "true"
      AUTH_GLOBAL_SECRET: ${AUTH_GLOBAL_SECRET:?set AUTH_GLOBAL_SECRET}
      AUTH_SIGNING_KEY_FILE: /run/auth-keys/active.pem
      AUTH_SIGNING_KEY_ID: ${AUTH_SIGNING_KEY_ID:?set AUTH_SIGNING_KEY_ID}
      AUTH_OVERLAP_JWKS_FILE: ${AUTH_OVERLAP_JWKS_FILE:-}
      EMAIL_PROVIDER: resend
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Flowdraw Auth}
      FLOWDRAW_CALLBACK_URL: ${FLOWDRAW_CALLBACK_URL:?set FLOWDRAW_CALLBACK_URL}
      FLOWDRAW_CLIENT_SECRET: ${FLOWDRAW_CLIENT_SECRET:?set FLOWDRAW_CLIENT_SECRET}
    volumes:
      - ${AUTH_KEYS_DIRECTORY:?set AUTH_KEYS_DIRECTORY}:/run/auth-keys:ro
    networks:
      - proxy
      - auth-private
    depends_on:
      auth-postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "auth", "health-ready"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  auth-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: flowdraw_auth
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:?set AUTH_POSTGRES_PASSWORD}
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    networks:
      - auth-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowdraw_auth -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

networks:
  proxy:
    external: true
    name: proxy
  auth-private:
    internal: true
volumes:
  auth_postgres_data:
